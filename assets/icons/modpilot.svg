<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sphere Icon -->
  <defs>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(139, 92, 246, 0.4);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgba(59, 130, 246, 0.2);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(59, 130, 246, 0);stop-opacity:0" />
    </radialGradient>

    <radialGradient id="sphereGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:rgba(167, 139, 250, 1);stop-opacity:1" />
      <stop offset="40%" style="stop-color:rgba(139, 92, 246, 1);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgba(99, 102, 241, 1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(59, 130, 246, 1);stop-opacity:1" />
    </radialGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255, 255, 255, 0.9);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(255, 255, 255, 0.4);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255, 255, 255, 0);stop-opacity:0" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255, 255, 255, 1);stop-opacity:1" />
      <stop offset="40%" style="stop-color:rgba(196, 181, 253, 0.8);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgba(139, 92, 246, 0.4);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139, 92, 246, 0);stop-opacity:0" />
    </radialGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(139, 92, 246, 1);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(99, 102, 241, 1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(59, 130, 246, 1);stop-opacity:1" />
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sphere (scaled down) -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="40" fill="url(#outerGlow)" opacity="0.6"/>
    <circle cx="50" cy="50" r="30" fill="url(#sphereGradient)" filter="url(#glow)"/>
    <ellipse cx="42" cy="40" rx="15" ry="10" fill="url(#glassReflection)" opacity="0.7" transform="rotate(-25 42 40)" filter="url(#blur)"/>
    <circle cx="50" cy="50" r="18" fill="url(#coreGlow)" opacity="0.8"/>
    <circle cx="40" cy="38" r="4" fill="rgba(255, 255, 255, 0.8)" opacity="0.9" filter="url(#blur)"/>
    <circle cx="35" cy="30" r="2" fill="rgba(167, 139, 250, 0.9)" filter="url(#glow)"/>
    <circle cx="65" cy="65" r="2" fill="rgba(99, 102, 241, 0.8)" filter="url(#glow)"/>
  </g>

  <!-- Text: ModPilot -->
  <text x="120" y="75" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="700" fill="url(#textGradient)" letter-spacing="-0.02em">
    ModPilot
  </text>

  <!-- Tagline -->
  <text x="122" y="95" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="rgba(100, 116, 139, 0.8)" letter-spacing="0.05em">
    YOUR AI COPILOT FOR CONTENT MODERATION
  </text>
</svg>
